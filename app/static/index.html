<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备课智能体 · 工作台</title>
<meta name="description" content="面向高校教师的全自动备课智能体：课程资料 → 课程地图 → 教案 / 讲义 / 课件 / 逐字稿 → 三处确认门 → 整包交付。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123c33'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23c9a961' font-family='serif'%3E%E5%A4%87%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css?v=2.1.3">
</head>
<body>
<div class="top-progress" id="topProgress"><i></i></div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="seal">备</div>
      <div><b>备课智能体</b><small>WORKFLOW SHELL · v2</small></div>
    </div>

    <button class="course-switch" id="courseSwitch" title="切换 / 新建课程">
      <span class="k">当前课程</span>
      <span class="v" id="courseName">未选择课程</span>
      <span class="meta" id="courseMeta">点击选择或新建</span>
    </button>

    <nav class="nav" id="nav">
      <div class="nav-label">备课流程</div>
      <button data-view="home" class="on"><span class="idx">01</span>课程工作台</button>
      <button data-view="materials"><span class="idx">02</span>资料库</button>
      <button data-view="plan"><span class="idx">03</span>课程地图<span class="g">门A</span></button>
      <button data-view="board"><span class="idx">04</span>生成中心</button>
      <button data-view="review"><span class="idx">05</span>确认中心<span class="g">门B</span><span class="cnt" id="navReviewCnt">0</span></button>
      <button data-view="deliver"><span class="idx">06</span>交付与用量<span class="g">门C</span></button>
      <div class="nav-label">系统</div>
      <button data-view="vault"><span class="idx">07</span>公共资源区</button>
      <button data-view="frameworks"><span class="idx">08</span>提示词框架</button>
    </nav>

    <div class="side-bottom">
      <div class="row">
        <span class="mode-pill" id="modePill"><i class="dot"></i><span id="modeText">加载中…</span></span>
        <span id="verText">v2.0</span>
      </div>
      <div id="sideHint">正在读取配置…</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="crumb"><b id="crumb">课程工作台</b></span>
      <span class="spacer"></span>
      <span class="model-tag" id="modelTag">模型加载中…</span>
      <button class="btn ghost sm" id="btnConfig">配置与帮助</button>
      <button class="btn sm" id="btnNewCourse">新建课程</button>
    </header>

    <main class="page">
      <section class="view on" id="v-home"></section>
      <section class="view" id="v-materials"></section>
      <section class="view" id="v-plan"></section>
      <section class="view" id="v-board"></section>
      <section class="view" id="v-review"></section>
      <section class="view" id="v-deliver"></section>
      <section class="view" id="v-vault"></section>
      <section class="view" id="v-frameworks"></section>
    </main>
  </div>
</div>

<div class="overlay hide" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-head"><h3 id="modalTitle">标题</h3><button class="x" id="modalClose" aria-label="关闭">×</button></div>
    <div id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast-box" id="toastBox"></div>

<script src="/static/md.js?v=2.1.3"></script>
<script src="/static/app.js?v=2.1.3"></script>
</body>
</html>
